<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive with gyotc Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <h1>Archive with gyotc</h1>
      <p class="description">右クリックメニューからアーカイブする際のオプションです。</p>

      <section class="card">
        <label class="checkbox-row">
          <input id="replaceTweetUsernameWithI" type="checkbox" />
          <span>
            <strong>X (旧Twitter) のTweet URLの場合に、ユーザ名を「i」に置き換える</strong>
            <small>
              例: <code>https://x.com/elonmusk/status/1519480761749016577</code><br />
              → <code>https://x.com/i/status/1519480761749016577</code>
            </small>
          </span>
        </label>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
